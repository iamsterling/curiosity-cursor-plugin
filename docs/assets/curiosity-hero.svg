<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Curiosity Cursor Plugin</title>
  <desc id="heroDesc">Banner for the Curiosity Cursor Plugin, version 0.6.0, MIT licensed. Subtitle: hierarchical, context-preserving delivery for Cursor, built from four agents, five composable skills, one command and one always-applied rule, all Markdown only. Three pillars are shown: Authority, meaning the parent orchestrates and one bounded implementer writes; Curiosity, meaning every substantive result carries a compact receipt that the parent gate checks; Evidence, meaning reproducible evidence and independent dual-pass review control completion.</desc>
  <style>
    svg {
      --bg: #f7f9fc;
      --edge: #d7dfea;
      --panel: #ffffff;
      --ink: #101828;
      --muted: #4a5568;
      --faint: #667085;
      --a1: #3b3ba8;
      --a2: #9a5b06;
      --a3: #0f6b62;
      --chip: #eef2f8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1420;
        --edge: #2a3549;
        --panel: #141d2c;
        --ink: #eaf0f8;
        --muted: #b6c2d2;
        --faint: #94a3b8;
        --a1: #a9b4ff;
        --a2: #f2b544;
        --a3: #67e2d2;
        --chip: #1c2739;
      }
    }
    .bg { fill: var(--bg); stroke: var(--edge); }
    .panel { fill: var(--panel); stroke: var(--edge); }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .eyebrow { fill: var(--faint); font-size: 12px; font-weight: 600; letter-spacing: 2.4px; }
    .title { fill: var(--ink); font-size: 42px; font-weight: 700; letter-spacing: -0.6px; }
    .sub { fill: var(--muted); font-size: 16px; }
    .pillar { fill: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
    .body { fill: var(--muted); font-size: 12.5px; }
    .num { font-size: 12px; font-weight: 700; }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .chiptext { fill: var(--muted); font-size: 12px; font-weight: 600; }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="318" rx="20" stroke-width="1.5"/>

  <g>
    <text class="eyebrow" x="56" y="72">CURSOR PLUGIN · v0.6.0 · MIT · FILE ONLY</text>
    <text class="title" x="56" y="126">Curiosity Cursor Plugin</text>
    <text class="sub" x="56" y="164">Hierarchical, context-preserving delivery guidance for Cursor.</text>
    <text class="sub" x="56" y="188">Four agents · five composable skills · one command · one always-applied rule.</text>

    <g>
      <rect class="chip" x="56" y="216" width="132" height="30" rx="15"/>
      <text class="chiptext" x="72" y="236">No runtime</text>
      <rect class="chip" x="198" y="216" width="112" height="30" rx="15"/>
      <text class="chiptext" x="214" y="236">No hooks</text>
      <rect class="chip" x="320" y="216" width="100" height="30" rx="15"/>
      <text class="chiptext" x="336" y="236">No MCP</text>
      <rect class="chip" x="430" y="216" width="98" height="30" rx="15"/>
      <text class="chiptext" x="446" y="236">No SDK</text>
      <rect class="chip" x="538" y="216" width="106" height="30" rx="15"/>
      <text class="chiptext" x="554" y="236">Markdown</text>
    </g>
  </g>

  <g>
    <rect class="panel" x="676" y="72" width="152" height="176" rx="14" stroke-width="1.5"/>
    <circle cx="702" cy="102" r="13" fill="none" stroke="var(--a1)" stroke-width="1.5"/>
    <text class="num" x="698" y="107" fill="var(--a1)">1</text>
    <text class="pillar" x="696" y="140">AUTHORITY</text>
    <text class="body" x="696" y="164">Parent orchestrates</text>
    <text class="body" x="696" y="182">and synthesizes.</text>
    <text class="body" x="696" y="200">One bounded</text>
    <text class="body" x="696" y="218">implementer writes.</text>
  </g>

  <g>
    <rect class="panel" x="842" y="72" width="152" height="176" rx="14" stroke-width="1.5"/>
    <circle cx="868" cy="102" r="13" fill="none" stroke="var(--a2)" stroke-width="1.5"/>
    <text class="num" x="864" y="107" fill="var(--a2)">2</text>
    <text class="pillar" x="862" y="140">CURIOSITY</text>
    <text class="body" x="862" y="164">Bounded assumption</text>
    <text class="body" x="862" y="182">challenge with a</text>
    <text class="body" x="862" y="200">compact receipt on</text>
    <text class="body" x="862" y="218">every real result.</text>
  </g>

  <g>
    <rect class="panel" x="1008" y="72" width="152" height="176" rx="14" stroke-width="1.5"/>
    <circle cx="1034" cy="102" r="13" fill="none" stroke="var(--a3)" stroke-width="1.5"/>
    <text class="num" x="1030" y="107" fill="var(--a3)">3</text>
    <text class="pillar" x="1028" y="140">EVIDENCE</text>
    <text class="body" x="1028" y="164">Reproducible</text>
    <text class="body" x="1028" y="182">evidence and</text>
    <text class="body" x="1028" y="200">independent review</text>
    <text class="body" x="1028" y="218">control completion.</text>
  </g>
</svg>
