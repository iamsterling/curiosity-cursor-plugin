<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Curiosity authority, evidence, and change lifecycle</title>
  <desc id="archDesc">Diagram of authority and evidence flow for the Curiosity Cursor plugin, which ships four agents, five skills, twelve commands and one always-applied rule. Everything runs inside the Cursor host in Agent mode, where permissions, tool access and model selection are host-controlled. At the top, the main agent orchestrates and synthesizes: it keeps intent, decisions, binary acceptance criteria, agent identifiers, evidence pointers and reviewer verdicts, and by prompt policy it never edits source and never runs project-mutating shell. It dispatches five workers that report straight back to it and never delegate. Built-in Explore is read-only and does broad repository discovery in a separate context, using no plugin skill. The strategist is read-only and designs consequential choices that an owner approves or selects, using the decision-design skill. The researcher is read-only and gathers external and version-sensitive claim ledgers, using the research-evidence skill. The implementer is the sole writer, making one bounded change with a failing test executed before behavior edits and applicable verification otherwise, using the implementation-discipline and architecture-awareness skills. The reviewer is read-only and returns an independent dual-pass verdict and never repairs, using the independent-review skill. Below, the workspace is read by the four read-only roles along dashed arrows and written only by the implementer along a solid arrow. Every substantive result returns a compact curiosity receipt to the parent Curiosity Gate, which accepts it, requests one bounded repair on the same agent identifier, or blocks and escalates for an owner decision, then returns control to the main agent. At the bottom, the file-only change lifecycle runs from the spec command to the implement command to the ledger command to the close command, which specify, implement, record and archive a change; these are four of the twelve semantic routing commands. A closing note states that every boundary drawn here is semantic prompt policy expressed in Markdown assets, not a host-enforced permission, and that model names are preferences the host may override.</desc>
  <style>
    svg {
      --bg: #f7f9fc;
      --edge: #d7dfea;
      --panel: #ffffff;
      --ink: #101828;
      --muted: #475467;
      --faint: #667085;
      --line: #8c9bb0;
      --main: #3538a8;
      --ro: #0f6b62;
      --rw: #a4193d;
      --gate: #8a5205;
      --chip: #eef2f8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1420;
        --edge: #2a3549;
        --panel: #141d2c;
        --ink: #eaf0f8;
        --muted: #bcc8d8;
        --faint: #94a3b8;
        --line: #7a8ba3;
        --main: #a9b4ff;
        --ro: #67e2d2;
        --rw: #ff9aae;
        --gate: #f2b544;
        --chip: #1c2739;
      }
      .grad0 { stop-color: #111a29; }
      .grad1 { stop-color: #0d1420; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: url(#aBg); stroke: var(--edge); }
    .panel { fill: var(--panel); stroke: var(--edge); }
    .host { fill: none; stroke: var(--edge); stroke-dasharray: 7 6; }
    .title { fill: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .sub { fill: var(--faint); font-size: 13px; }
    .hostlabel { fill: var(--faint); font-size: 12.5px; font-weight: 600; letter-spacing: 1.1px; }
    .h1 { fill: var(--ink); font-size: 18px; font-weight: 700; }
    .h2 { fill: var(--ink); font-size: 16px; font-weight: 700; }
    .body { fill: var(--muted); font-size: 14px; }
    .small { fill: var(--faint); font-size: 13px; }
    .badge { font-size: 11.5px; font-weight: 700; letter-spacing: 0.9px; }
    .chip { fill: var(--chip); stroke: var(--edge); }
    .chiptext { fill: var(--muted); font-size: 11.8px; font-weight: 600; }
    .count { fill: var(--ink); font-size: 13.5px; font-weight: 700; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.7; }
    .read { fill: none; stroke: var(--ro); stroke-width: 1.7; stroke-dasharray: 6 5; }
    .write { fill: none; stroke: var(--rw); stroke-width: 2.8; }
    .pill { fill: var(--chip); stroke: var(--edge); }
    .pilltext { fill: var(--ink); font-size: 13.5px; font-weight: 600; }
    .pillnote { fill: var(--faint); font-size: 12.5px; }
  </style>

  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop class="grad0" offset="0" stop-color="#ffffff"/>
      <stop class="grad1" offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ro)"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--rw)"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1078" height="978" rx="22" stroke-width="1.5"/>

  <!-- header -->
  <text class="title" x="40" y="58">Curiosity — orchestration and evidence flow</text>
  <text class="sub" x="40" y="86">File-only Cursor plugin · v0.8.0 · MIT licensed · iamsterling/curiosity-cursor-plugin</text>

  <g>
    <rect class="panel" x="538" y="36" width="118" height="30" rx="15" stroke-width="1.2"/>
    <text class="count" x="558" y="56">4 agents</text>
    <rect class="panel" x="666" y="36" width="118" height="30" rx="15" stroke-width="1.2"/>
    <text class="count" x="690" y="56">5 skills</text>
    <rect class="panel" x="794" y="36" width="118" height="30" rx="15" stroke-width="1.2"/>
    <text class="count" x="810" y="56">12 commands</text>
    <rect class="panel" x="922" y="36" width="118" height="30" rx="15" stroke-width="1.2"/>
    <text class="count" x="938" y="56">1 always rule</text>
  </g>

  <!-- host envelope -->
  <rect class="host" x="40" y="106" width="1000" height="624" rx="18" stroke-width="1.5"/>
  <text class="hostlabel" x="72" y="132">CURSOR HOST · AGENT MODE — PERMISSIONS, TOOL ACCESS AND MODEL SELECTION ARE HOST-CONTROLLED</text>

  <!-- main agent -->
  <rect class="panel" x="72" y="146" width="936" height="84" rx="14" stroke-width="1.5"/>
  <rect x="72" y="146" width="5" height="84" rx="2.5" fill="var(--main)"/>
  <text class="h1" x="96" y="178">Main agent — orchestrates and synthesizes</text>
  <text class="body" x="96" y="202">Keeps intent, decisions, binary acceptance criteria, agent IDs, evidence pointers and reviewer verdicts.</text>
  <text class="small" x="96" y="222">Prompt policy: never edits project source, never runs mutating shell. Workers report back to main and never delegate.</text>

  <!-- dispatch -->
  <path class="flow" d="M154 230 L154 250" marker-end="url(#ah)"/>
  <path class="flow" d="M338 230 L338 250" marker-end="url(#ah)"/>
  <path class="flow" d="M522 230 L522 250" marker-end="url(#ah)"/>
  <path class="flow" d="M724 230 L724 250" marker-end="url(#ah)"/>
  <path class="flow" d="M926 230 L926 250" marker-end="url(#ah)"/>

  <!-- explore -->
  <g>
    <rect class="panel" x="72" y="252" width="164" height="196" rx="14" stroke-width="1.5"/>
    <text class="badge" x="90" y="278" fill="var(--ro)">READ-ONLY</text>
    <text class="h2" x="90" y="302">Explore</text>
    <text class="small" x="90" y="320">built in to Cursor</text>
    <text class="body" x="90" y="348">Broad repository</text>
    <text class="body" x="90" y="366">discovery, kept out</text>
    <text class="body" x="90" y="384">of parent context.</text>
    <text class="small" x="90" y="412">no plugin skill</text>
  </g>

  <!-- strategist -->
  <g>
    <rect class="panel" x="256" y="252" width="164" height="196" rx="14" stroke-width="1.5"/>
    <text class="badge" x="274" y="278" fill="var(--ro)">READ-ONLY</text>
    <text class="h2" x="274" y="302">Strategist</text>
    <text class="small" x="274" y="320">model: grok-4.6</text>
    <text class="body" x="274" y="348">Designs consequential</text>
    <text class="body" x="274" y="366">choices; an owner</text>
    <text class="body" x="274" y="384">approves or selects.</text>
    <rect class="chip" x="274" y="398" width="128" height="22" rx="11" stroke-width="1.2"/>
    <text class="chiptext" x="284" y="413">decision-design</text>
  </g>

  <!-- researcher -->
  <g>
    <rect class="panel" x="440" y="252" width="164" height="196" rx="14" stroke-width="1.5"/>
    <text class="badge" x="458" y="278" fill="var(--ro)">READ-ONLY</text>
    <text class="h2" x="458" y="302">Researcher</text>
    <text class="small" x="458" y="320">model: grok-4.6</text>
    <text class="body" x="458" y="348">External and</text>
    <text class="body" x="458" y="366">version-sensitive</text>
    <text class="body" x="458" y="384">claim ledgers.</text>
    <rect class="chip" x="458" y="398" width="132" height="22" rx="11" stroke-width="1.2"/>
    <text class="chiptext" x="468" y="413">research-evidence</text>
  </g>

  <!-- implementer -->
  <g>
    <rect class="panel" x="624" y="252" width="200" height="196" rx="14" stroke-width="1.5"/>
    <rect x="624" y="252" width="5" height="196" rx="2.5" fill="var(--rw)"/>
    <text class="badge" x="648" y="278" fill="var(--rw)">SOLE WRITER</text>
    <text class="h2" x="648" y="302">Implementer</text>
    <text class="small" x="648" y="320">model: composer-2.5</text>
    <text class="body" x="648" y="348">One bounded change.</text>
    <text class="body" x="648" y="366">Failing RED executed</text>
    <text class="body" x="648" y="384">before behavior edits.</text>
    <rect class="chip" x="648" y="392" width="158" height="22" rx="11" stroke-width="1.2"/>
    <text class="chiptext" x="658" y="407">implementation-discipline</text>
    <rect class="chip" x="648" y="418" width="158" height="22" rx="11" stroke-width="1.2"/>
    <text class="chiptext" x="658" y="433">architecture-awareness</text>
  </g>

  <!-- reviewer -->
  <g>
    <rect class="panel" x="844" y="252" width="164" height="196" rx="14" stroke-width="1.5"/>
    <text class="badge" x="862" y="278" fill="var(--ro)">READ-ONLY</text>
    <text class="h2" x="862" y="302">Reviewer</text>
    <text class="small" x="862" y="320">model: claude-sonnet-5</text>
    <text class="body" x="862" y="348">Independent</text>
    <text class="body" x="862" y="366">dual-pass verdict;</text>
    <text class="body" x="862" y="384">never repairs.</text>
    <rect class="chip" x="862" y="398" width="136" height="22" rx="11" stroke-width="1.2"/>
    <text class="chiptext" x="872" y="413">independent-review</text>
  </g>

  <!-- workspace access -->
  <path class="read" d="M154 448 L154 492" marker-end="url(#ahr)"/>
  <path class="read" d="M338 448 L338 492" marker-end="url(#ahr)"/>
  <path class="read" d="M522 448 L522 492" marker-end="url(#ahr)"/>
  <path class="write" d="M724 448 L724 492" marker-end="url(#ahw)"/>
  <path class="read" d="M926 448 L926 492" marker-end="url(#ahr)"/>
  <text class="small" x="536" y="476" fill="var(--ro)">read</text>
  <text class="small" x="738" y="476" fill="var(--rw)">write</text>

  <rect class="panel" x="72" y="496" width="936" height="76" rx="14" stroke-width="1.5"/>
  <text class="h2" x="96" y="528">Your workspace</text>
  <text class="body" x="96" y="552">Four roles read it. Only the implementer writes, inside granted paths; non-behavior work uses applicable verification.</text>

  <!-- receipt into gate -->
  <path class="flow" d="M522 572 L522 608" marker-end="url(#ah)"/>
  <text class="small" x="536" y="596">CURIOSITY_RECEIPT on every substantive result</text>

  <!-- gate -->
  <rect class="panel" x="72" y="612" width="936" height="96" rx="14" stroke-width="1.5"/>
  <rect x="72" y="612" width="5" height="96" rx="2.5" fill="var(--gate)"/>
  <text class="h2" x="96" y="642">Parent Curiosity Gate</text>
  <text class="body" x="96" y="666">Accept · one bounded same-ID repair · BLOCK or USER_DECISION_REQUIRED. Raw evidence outranks Todo state; two review cycles maximum.</text>
  <text class="small" x="96" y="688">Passing verdicts are only PASS or PASS_WITH_NOTES, through the canonical evidence gate; an unverified summary can never establish PASS.</text>

  <!-- return to main -->
  <path class="flow" d="M72 660 L54 660 L54 188 L72 188" marker-end="url(#ah)"/>

  <!-- legend -->
  <g>
    <path class="read" d="M40 750 L78 750" marker-end="url(#ahr)"/>
    <text class="small" x="86" y="754">read-only access</text>
    <path class="write" d="M204 750 L242 750" marker-end="url(#ahw)"/>
    <text class="small" x="250" y="754">write access</text>
    <path class="flow" d="M352 750 L390 750" marker-end="url(#ah)"/>
    <text class="small" x="398" y="754">orchestration and result flow</text>
  </g>

  <!-- lifecycle -->
  <rect class="panel" x="40" y="776" width="1000" height="136" rx="16" stroke-width="1.5"/>
  <text class="h2" x="72" y="806">File-only change lifecycle</text>

  <g>
    <rect class="pill" x="106" y="820" width="196" height="38" rx="12" stroke-width="1.2"/>
    <text class="pilltext" x="204" y="844" text-anchor="middle">/curiosity-spec</text>
    <text class="pillnote" x="204" y="878" text-anchor="middle">specify</text>

    <path class="flow" d="M306 839 L326 839" marker-end="url(#ah)"/>

    <rect class="pill" x="330" y="820" width="196" height="38" rx="12" stroke-width="1.2"/>
    <text class="pilltext" x="428" y="844" text-anchor="middle">/curiosity-implement</text>
    <text class="pillnote" x="428" y="878" text-anchor="middle">one writer, then fresh review</text>

    <path class="flow" d="M530 839 L550 839" marker-end="url(#ah)"/>

    <rect class="pill" x="554" y="820" width="196" height="38" rx="12" stroke-width="1.2"/>
    <text class="pilltext" x="652" y="844" text-anchor="middle">/curiosity-ledger</text>
    <text class="pillnote" x="652" y="878" text-anchor="middle">record</text>

    <path class="flow" d="M754 839 L774 839" marker-end="url(#ah)"/>

    <rect class="pill" x="778" y="820" width="196" height="38" rx="12" stroke-width="1.2"/>
    <text class="pilltext" x="876" y="844" text-anchor="middle">/curiosity-close</text>
    <text class="pillnote" x="876" y="878" text-anchor="middle">validate and archive</text>
  </g>

  <text class="small" x="72" y="902">Four of the twelve commands. All twelve are semantic routing prompts, not host-enforced schedulers.</text>

  <!-- caveat -->
  <text class="small" x="40" y="934">Every boundary drawn here is semantic prompt policy expressed in Markdown assets. Cursor does not enforce a parent no-edit rule, because children</text>
  <text class="small" x="40" y="952">inherit the parent mode and tool envelope. Model names are preferences; the host may select a compatible fallback.</text>
</svg>
